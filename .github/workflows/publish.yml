name: Publish to Hex

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          rebar3-version: '3.27.0'

      - name: Publish package and docs
        run: rebar3 as publish hex publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
